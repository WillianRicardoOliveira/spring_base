# ========================================
# BANCO DE DADOS
# ========================================

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate


# ========================================
# CORS
# ========================================

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}


# ========================================
# SSO / MICROSOFT ENTRA ID
# ========================================

spring.security.oauth2.resourceserver.jwt.issuer-uri=${AZURE_ISSUER_URI}

sso.claim.email=${SSO_EMAIL_CLAIM:preferred_username}
sso.audience=${AZURE_API_AUDIENCE}
sso.scope=${AZURE_API_SCOPE}


# ========================================
# BOOTSTRAP INICIAL
# ========================================

app.bootstrap.enabled=${BOOTSTRAP_ENABLED:false}


# ========================================
# CONVITE DE ORGANIZAÇÃO
# ========================================

app.convite-organizacao.validade=${CONVITE_ORGANIZACAO_VALIDADE:48h}
app.convite-organizacao.url-aceite=${CONVITE_ORGANIZACAO_URL_ACEITE}
app.convite-organizacao.remetente=${CONVITE_ORGANIZACAO_REMETENTE}


# ========================================
# E-MAIL
# ========================================

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:true}


# ========================================
# DOCUMENTAÇÃO DA API
# ========================================

app.security.swagger-public=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false