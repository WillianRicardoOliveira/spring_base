# ========================================
# BANCO DE DADOS
# ========================================

spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:erp_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop


# ========================================
# SEGURANÇA E JWT
# ========================================

api.security.token.secret=segredo-super-seguro-para-testes-com-mais-de-32-caracteres
api.security.token.issuer=erp-api-test
api.security.token.expiration-minutes=120

api.security.refresh-token.expiration-days=7
api.security.refresh-token.cleanup-cron=0 0 * * * *

app.security.login.max-failed-attempts=5
app.security.login.lock-minutes=15

app.security.swagger-public=false


# ========================================
# CORS
# ========================================

app.cors.allowed-origins=http://localhost:4200


# ========================================
# SSO / MICROSOFT ENTRA ID
# ========================================

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/test/v2.0

sso.claim.email=preferred_username
sso.audience=api-test
sso.scope=sso.login


# ========================================
# BOOTSTRAP INICIAL
# ========================================

app.bootstrap.enabled=false


# ========================================
# CONVITE DE ORGANIZAÇÃO
# ========================================

app.convite-organizacao.validade=48h
app.convite-organizacao.url-aceite=http://localhost:4200/convites/organizacao/aceitar
app.convite-organizacao.remetente=nao-responda@teste.local


# ========================================
# E-MAIL
# ========================================

spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=
spring.mail.password=

spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false

spring.mail.properties.mail.smtp.connectiontimeout=100
spring.mail.properties.mail.smtp.timeout=100
spring.mail.properties.mail.smtp.writetimeout=100


# ========================================
# DOCUMENTAÇÃO DA API
# ========================================

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false