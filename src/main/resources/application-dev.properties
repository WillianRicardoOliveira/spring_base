# ========================================
# BANCO DE DADOS
# ========================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/erp}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}


# ========================================
# SEGURANCA E JWT
# ========================================

api.security.token.secret=${JWT_SECRET:segredo-exclusivo-para-desenvolvimento-com-32-caracteres}
api.security.token.issuer=${JWT_ISSUER:erp-api-dev}
api.security.token.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}

api.security.refresh-token.expiration-days=${REFRESH_TOKEN_EXPIRATION_DAYS:7}
api.security.refresh-token.cleanup-cron=${REFRESH_TOKEN_CLEANUP_CRON:0 0 * * * *}

app.security.login.max-failed-attempts=${LOGIN_MAX_FAILED_ATTEMPTS:5}
app.security.login.lock-minutes=${LOGIN_LOCK_MINUTES:15}

app.security.swagger-public=true


# ========================================
# CORS
# ========================================

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}


# ========================================
# SSO / MICROSOFT ENTRA ID
# ========================================

spring.security.oauth2.resourceserver.jwt.issuer-uri=${AZURE_ISSUER_URI:https://login.microsoftonline.com/58cef822-b53b-49c4-9241-87216ef31a4f/v2.0}

sso.claim.email=${SSO_EMAIL_CLAIM:preferred_username}
sso.audience=${AZURE_API_AUDIENCE:e807cbd8-3d3c-4292-a7df-e8f1e94076e6}
sso.scope=${AZURE_API_SCOPE:Employees.Read.All}


# ========================================
# DOCUMENTACAO DA API
# ========================================

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true