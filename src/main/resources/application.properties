# ========================================
# BANCO DE DADOS
# ========================================

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate


# ========================================
# SEGURANCA E JWT
# ========================================

api.security.token.secret=${JWT_SECRET}
api.security.token.issuer=${JWT_ISSUER}
api.security.token.expiration-minutes=${JWT_EXPIRATION_MINUTES}

api.security.refresh-token.expiration-days=${REFRESH_TOKEN_EXPIRATION_DAYS}
api.security.refresh-token.cleanup-cron=${REFRESH_TOKEN_CLEANUP_CRON}

app.security.login.max-failed-attempts=${LOGIN_MAX_FAILED_ATTEMPTS}
app.security.login.lock-minutes=${LOGIN_LOCK_MINUTES}

app.security.swagger-public=false


# ========================================
# CORS
# ========================================

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}


# ========================================
# SSO / MICROSOFT ENTRA ID
# ========================================

spring.security.oauth2.resourceserver.jwt.issuer-uri=${AZURE_ISSUER_URI}

sso.claim.email=${SSO_EMAIL_CLAIM:preferred_username}
sso.audience=${AZURE_API_AUDIENCE}
sso.scope=${AZURE_API_SCOPE}


# ========================================
# BOOTSTRAP INICIAL
# ========================================

app.bootstrap.enabled=${BOOTSTRAP_ENABLED:false}

app.bootstrap.organization-name=${BOOTSTRAP_ORGANIZATION_NAME:}
app.bootstrap.organization-admin-email=${BOOTSTRAP_ORGANIZATION_ADMIN_EMAIL:}
app.bootstrap.organization-admin-password=${BOOTSTRAP_ORGANIZATION_ADMIN_PASSWORD:}

app.bootstrap.platform-admin-email=${BOOTSTRAP_PLATFORM_ADMIN_EMAIL:}
app.bootstrap.platform-admin-password=${BOOTSTRAP_PLATFORM_ADMIN_PASSWORD:}


# ========================================
# CONVITE DE ORGANIZACAO
# ========================================

app.convite-organizacao.validade=${CONVITE_ORGANIZACAO_VALIDADE:48h}
app.convite-organizacao.url-aceite=${CONVITE_ORGANIZACAO_URL_ACEITE:http://localhost:4200/convites/organizacao/aceitar}
app.convite-organizacao.remetente=${CONVITE_ORGANIZACAO_REMETENTE:${MAIL_USERNAME:nao-responda@localhost}}


# ========================================
# E-MAIL
# ========================================

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8

spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:true}

spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:5000}


# ========================================
# DOCUMENTACAO DA API
# ========================================

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false


# ========================================
# ERROS HTTP
# ========================================

server.error.include-stacktrace=never