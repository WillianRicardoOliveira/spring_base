name: Maven Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Compilar e testar com Maven
        run: ./mvnw --batch-mode clean package

      - name: Preparar o JAR para envio
        id: jar
        shell: bash
        run: |
          mkdir -p jar-upload

          JAR_PATH=$(find target -maxdepth 1 -type f \
            -name "*.jar" \
            ! -name "*.original" \
            | head -n 1)

          if [ -z "$JAR_PATH" ]; then
            echo "Nenhum arquivo JAR foi encontrado em target/"
            exit 1
          fi

          JAR_NAME=$(basename "$JAR_PATH" .jar)

          cp "$JAR_PATH" jar-upload/
          echo "jar_name=$JAR_NAME" >> "$GITHUB_OUTPUT"
          echo "JAR preparado: $JAR_NAME.jar"

      - name: Enviar o JAR por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.HOST }}
          username: ${{ secrets.USUARIOCPANEL }}
          password: ${{ secrets.SENHACPANEL }}
          local-dir: ./jar-upload/
          server-dir: ~/appservers/standalone/

      - name: Instalar cliente SSH
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Reiniciar a aplicação Spring Boot
        env:
          HOST: ${{ secrets.HOST }}
          USUARIOCPANEL: ${{ secrets.USUARIOCPANEL }}
          SENHACPANEL: ${{ secrets.SENHACPANEL }}
          JAR_NAME: ${{ steps.jar.outputs.jar_name }}
        shell: bash
        run: |
          export SSHPASS="$SENHACPANEL"

          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            "$USUARIOCPANEL@$HOST" \
            "bash appservers/tmp/${JAR_NAME}.sh stop && bash appservers/tmp/${JAR_NAME}.sh start"
